name: lijazsalim/simple-maven-app
on:
  push:
  workflow_dispatch:
concurrency:
  group: "${{ github.ref }}"
  cancel-in-progress: true
jobs:
  verify-jdk8:
    runs-on: ubuntu-24.04
    container:
      image: maven:3.3.9-jdk-8
    if: !(github.ref == 'refs/heads/master')
    timeout-minutes: 60
    env:
      MAVEN_OPTS: "-Dhttps.protocols=TLSv1.2 -Dmaven.repo.local=${{ github.workspace }}/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
      MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        fetch-depth: 0
        lfs: true
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ".m2/repository"
        key: "${{ runner.os }}-maven-jdk8-3.3.9-${{ hashFiles('**/pom.xml') }}"
        restore-keys: "${{ runner.os }}-maven-jdk8-3.3.9-"
    - name: Verify with the original Maven and Java versions
      shell: bash
      run: |
        docker run --rm \
          --user "$(id -u):$(id -g)" \
          --env HOME=/tmp --env MAVEN_CONFIG=/tmp \
          --env MAVEN_OPTS --env MAVEN_CLI_OPTS \
          --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
          --workdir "$GITHUB_WORKSPACE" \
          maven@sha256:18e8bd367c73c93e29d62571ee235e106b18bf6718aeb235c7a07840328bba71 \
          sh -c 'mvn $MAVEN_CLI_OPTS verify'
